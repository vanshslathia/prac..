<html>
<style>
    .container {
        margin: 40px auto;
        width: 80%;
    }
    .button {
        width: 160px;
        height: 45px;
        border-radius: 6px;
        font-size: 15px;
        margin-top: 20px;
    }
    img {
        width: 328px;
        height: 287px;
        display: block;
        margin-bottom: 20px;
    }
    hr {
        width: 400px;
        margin-left: 0;
    }
    h3 {
        display: inline-block;
    }

    /* Show profile by default */
    #container {
        display: block;
    }
    #container-edit {
        display: none;
    }
</style>

<script>
window.onload = function() {
  fetch('/get-profile')
    .then(res => res.json())
    .then(data => {
      if (!data) return;

      document.querySelector('#name').textContent = data.name || 'Anna Smith';
      document.querySelector('#email').textContent = data.email || 'anna.smith@example.com';
      document.querySelector('#interests').textContent = data.interests || 'coding';
    })
    .catch(err => console.error(err));
};

function editProfile() {
  document.querySelector('#container').style.display = 'none';
  document.querySelector('#container-edit').style.display = 'block';

  document.querySelector('#input-name').value =
    document.querySelector('#name').textContent;

  document.querySelector('#input-email').value =
    document.querySelector('#email').textContent;

  document.querySelector('#input-interests').value =
    document.querySelector('#interests').textContent;
}

function saveProfile() {
  const data = {
    name: document.querySelector('#input-name').value,
    email: document.querySelector('#input-email').value,
    interests: document.querySelector('#input-interests').value
  };

  fetch('/update-profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(() => fetch('/get-profile'))
  .then(res => res.json())
  .then(updated => {
    console.log("Updated:", updated);

    document.querySelector('#name').textContent = updated.name;
    document.querySelector('#email').textContent = updated.email;
    document.querySelector('#interests').textContent = updated.interests;

    document.querySelector('#container').style.display = 'block';
    document.querySelector('#container-edit').style.display = 'none';
  })
  .catch(err => console.error(err));
}
</script>

<body>
    <div class='container' id='container'>
        <h1>User profile</h1>
        <img src='profile-picture' alt="user-profile">
        <span>Name: </span><h3 id='name'>Anna Smith</h3>
        <hr />
        <span>Email: </span><h3 id='email'>anna.smith@example.com</h3>
        <hr />
        <span>Interests: </span><h3 id='interests'>coding</h3>
        <hr />
        <button class='button' onclick="editProfile()">Edit Profile</button>
    </div>

    <div class='container' id='container-edit'>
        <h1>User profile</h1>
        <img src='profile-picture' alt="user-profile">
        <span>Name: </span>
        <input type="text" id='input-name' />
        <hr />

        <span>Email: </span>
        <input type="email" id='input-email' />
        <hr />

        <span>Interests: </span>
        <input type="text" id='input-interests' />
        <hr />

        <button class='button' onclick="saveProfile()">Update Profile</button>
    </div>
</body>
</html>
